<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GranCole</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <img src="salon-de-clase.jpg" alt="Imagen educativa" class="background-image">
    </div>
    <div class="right-panel">
      <div class="form-box">
        <img src="logo-colegio.png" alt="Logo GranCole" class="logo">
        <h1>Bienvenido a GranCole</h1>
        <p class="subtitle">Inicia sesión para continuar</p>
        <p class="description">Ingresa tus credenciales para acceder al sistema</p>
        <form>
          <input type="text" placeholder="Usuario" required>
          <input type="password" placeholder="Contraseña" required>
          <button type="submit">Iniciar Sesión</button>
        </form>
        <div class="links">
          <a href="#">¿Olvidaste tu contraseña?</a>
          <a href="#">¿Tienes dudas? Contacta al administrador</a>
        </div>
        <footer>© 2025 GranCole Pro. Todos los derechos reservados. Diseñado por Agencia Cristal.</footer>
      </div>
    </div>
  </div>
</body>
</html>
